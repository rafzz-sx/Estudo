name: BatCaverna CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    name: Lint & Build Pipeline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: batcaverna

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: batcaverna/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run build
